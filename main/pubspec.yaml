name: user
description: "The mobile application that runs the user interface for user and guest categories in Serchservice."

publish_to: 'none'

version: 1.1.0+9

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  google_maps_flutter: ^2.10.0
  google_directions_api: ^0.10.0
  google_maps_utils: ^2.0.0+1
  map_launcher: ^3.5.0
  shimmer: ^3.0.0
  bubble: ^1.2.1
  cached_network_image: ^3.4.1
  onesignal_flutter: ^5.2.9
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.19.0
  local_auth: ^2.3.0
  font_awesome_flutter: ^10.8.0
  auto_size_text: ^3.0.0
  fl_chart: ^0.70.1
  share_plus: ^10.1.3
  file_picker: ^8.1.7
  universal_io: ^2.2.2
  url_launcher: ^6.3.1
  just_audio: ^0.9.42
  app_links: ^6.3.3
  animations: ^2.0.11
  photo_gallery: ^2.2.1
  flutter_dotenv: ^5.2.1
  flutter_rating_bar: ^4.0.1
  flutter_native_splash: ^2.4.4
  flutter_timezone: ^4.0.0
  flutter_sound_record: ^3.3.2
  flutter_svg:
  flutter_linkify: ^6.0.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.2
  device_safety_info: ^0.0.9
  path_provider: ^2.1.5
  syncfusion_flutter_pdf: ^28.1.38
  photo_view: ^0.15.0
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0
  firebase_remote_config: ^5.3.0
  pinput: ^5.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.10.0
  webview_flutter_android: any
  webview_flutter_wkwebview: any
  in_app_update: ^4.2.3
  in_app_review: ^2.0.10
  infinite_scroll_pagination: ^4.1.0
  stream_video_flutter: ^0.6.1
#  stream_video_push_notification: ^0.6.1

  connectify_flutter:
    git:
      url: https://github.com/Serchservice/flutter.git
      ref: main
      path: connectify_flutter
  websocket_flutter:
    git:
      url: https://github.com/Serchservice/flutter.git
      ref: main
      path: websocket_flutter
  logger_flutter:
    git:
      url: https://github.com/Serchservice/flutter.git
      ref: main
      path: logger_flutter
  secure_flutter:
    git:
      url: https://github.com/Serchservice/flutter.git
      ref: main
      path: secure_flutter
  notify_flutter:
    git:
      url: https://github.com/Serchservice/flutter.git
      ref: main
      path: notify_flutter

dependency_overrides:
  just_audio_web:
    git:
      url: https://github.com/SleepySquash/just_audio
      path: just_audio_web
      ref: 1326-improve-web-methods-signature
  dart_webrtc:
    git:
      url: https://github.com/flutter-webrtc/dart-webrtc.git
      ref: f27d27c7af41ceeebe31b295af4fb38e7b4d793e
      
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"
  hive_generator: ^2.0.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - asset/
    - asset/logo/
    - asset/anim/
    - asset/audio/
    - asset/social/
    - asset/common/
    - asset/theme/
    - asset/conversation/
    - asset/map/
    - asset/app/
    - .env

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "asset/logo/logo_icon.png"
  adaptive_icon_background: "#030001"
  adaptive_icon_foreground: "asset/logo/logo_icon.png"
  background_color_ios: "#030001"
  #  adaptive_icon_foreground_inset: 80
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "asset/logo/logo_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "asset/logo/logo_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "asset/logo/logo_icon.png"

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  # background_image: "asset/lightWallpaper.png"
  image: asset/logo/logo-splash-screen.png
  branding: asset/logo/branding-splash-screen.png

  # To position the branding image at the bottom of the screen you can use bottom, bottomRight,
  # and bottomLeft. The default values is bottom if not specified or specified something else.
  #branding_mode: bottom
  # color_dark: "#030001"
  # background_image_dark: asset/darkWallpaper.png
  # image_dark: asset/logo/splashWhite.png
  # branding_dark: asset/logo/tagWhite.png
  android_12:
    image: asset/logo/logo-splash-screen-android-12.png
    color: "#FFFFFF"
    # icon_background_color: "#030001"
    branding: asset/logo/branding-splash-screen-android-12.png
    # image_dark: asset/logo/splashWhite.png
    # color_dark: "#030001"
    # icon_background_color_dark: "#FFFFFF"
    # branding_dark: asset/logo/tagWhite.png
  #android: false
  #ios: false
  #web: false

  # Platform specific images can be specified with the following parameters, which will override
  # the respective parameter.  You may specify all, selected, or none of these parameters:
  #color_android: "#42a5f5"
  #color_dark_android: "#042a49"
  #color_ios: "#42a5f5"
  #color_dark_ios: "#042a49"
  #color_web: "#42a5f5"
  #color_dark_web: "#042a49"
  #image_android: assets/splash-android.png
  #image_dark_android: assets/splash-invert-android.png
  #image_ios: assets/splash-ios.png
  #image_dark_ios: assets/splash-invert-ios.png
  #image_web: assets/splash-web.png
  #image_dark_web: assets/splash-invert-web.png
  #background_image_android: "assets/background-android.png"
  #background_image_dark_android: "assets/dark-background-android.png"
  #background_image_ios: "assets/background-ios.png"
  #background_image_dark_ios: "assets/dark-background-ios.png"
  #background_image_web: "assets/background-web.png"
  #background_image_dark_web: "assets/dark-background-web.png"
  #branding_android: assets/brand-android.png
  #branding_dark_android: assets/dart_dark-android.png
  #branding_ios: assets/brand-ios.png
  #branding_dark_ios: assets/dart_dark-ios.png

  # The position of the splash image can be set with android_gravity, ios_content_mode, and
  # web_image_mode parameters.  All default to center.
  #
  # android_gravity can be one of the following Android Gravity (see
  # https://developer.android.com/reference/android/view/Gravity): bottom, center,
  # center_horizontal, center_vertical, clip_horizontal, clip_vertical, end, fill, fill_horizontal,
  # fill_vertical, left, right, start, or top.
  #android_gravity: center
  #
  # ios_content_mode can be one of the following iOS UIView.ContentMode (see
  # https://developer.apple.com/documentation/uikit/uiview/contentmode): scaleToFill,
  # scaleAspectFit, scaleAspectFill, center, top, bottom, left, right, topLeft, topRight,
  # bottomLeft, or bottomRight.
  #ios_content_mode: center
  #
  # web_image_mode can be one of the following modes: center, contain, stretch, and cover.
  #web_image_mode: center
  #android_screen_orientation: sensorLandscape
  fullscreen: true

  # If you have changed the name(s) of your info.plist file(s), you can specify the filename(s)
  # with the info_plist_files parameter.  Remove only the # characters in the three lines below,
  # do not remove any spaces:
  #info_plist_files:
  #  - 'ios/Runner/Info-Debug.plist'
  #  - 'ios/Runner/Info-Release.plist'